<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input id="taskInput" placeholder="Enter task" />
    <button id="addTask">Add Task</button>
    <p id="taskCount">Tasks: 0</p>

    <ul id="taskList"></ul>
    <script type="module" src="dynamicToDo.js"></script>
  </body>
</html>


<!-- Requirements
When Add Task is clicked:
1. Get the input value.
2. Ignore empty/whitespace-only input.
3. Create an <li>.
4. Put the task text inside it.
5. Add a Delete button inside the <li>.
6. Add the <li> to #taskList.
7. Clear the input. -->
